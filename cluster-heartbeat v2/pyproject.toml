[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-heartbeat"
version = "0.1.0"
description = "AI workload fingerprinting for GPU clusters: predictive failure detection, smart scheduling, and cost optimization from Prometheus + NVIDIA DCGM telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Slow Walker" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
